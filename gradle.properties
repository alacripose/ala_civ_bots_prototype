org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# The build's own JDK, pinned. With JAVA_HOME pointed at JDK 25 the Groovy compiler cannot read the
# build script ("Unsupported class file major version 69"), so whether a build worked depended on
# which shell launched it. The mod targets Java 17 bytecode and builds on the installed 21.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.10.7-hotspot

# The JVM the server actually runs on. Minecraft 1.20.1 is only certified on Java 17, so this is an
# explicit override, not a supported combination; see README "Java 25 and Fabric Loader 0.20.1".
server_java_home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.7-hotspot

# Minecraft 1.20.1 / Fabric (Phase 0 contract: see docs/PHASE0_CONTRACTS.md)
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
# Loader 0.20.1, to match the client. The dev server runs on JDK 25.0.4 (see server_java_home);
# the build itself stays on JDK 21 because Gradle 8.8's Groovy compiler cannot read 25 class files.
loader_version=0.20.1
fabric_version=0.92.12+1.20.1

mod_version=0.1.0
maven_group=dev.ensouled
archives_base_name=ensouled
